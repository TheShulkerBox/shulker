id: shulkerbox
minecraft: "26.3"

require:
  # it needs to go first so that exit phase happens last
  - plugins.upload

  - bolt_expressions
  - bolt_expressions.contrib.commands
  - bolt.contrib.defer
  - bolt
  - bolt_anchors
  - bolt_native_macros
  - bolt_selectors
  - mecha.contrib.nesting
  - plugins.component_caching

  # needs to go last
  - plugins.custom_load

pipeline:
  - plugins.component_import
  - plugins.source_map
  - mecha
  - plugins.minecraft_namespace_checker
  - plugins.cleanup_empty_functions

data_pack:
  min_format: [121, 0]
  max_format: [121, 0]
  load: [ vendor/* ]

  filter:
    block:
      - namespace: "minecraft"
        path: "recipes/*"
      - namespace: "minecraft"
        path: "advancements/*"
      - namespace: "minecraft"
        path: "loot_tables/*"

output: dist

meta:
  deploy: false
  generate_namespace: "server"

  bolt:
    entrypoint: "*"
    prelude: [ "server:prelude" ]

  bolt_expressions:
    temp_objective: "temp"
    const_objective: "const"
    temp_storage: "bolt:temp"
    init_path: "core/load/init_objectives"
