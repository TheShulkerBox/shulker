id: shulkerbox
minecraft: "26.2"

require:
  # it needs to go first so that exit phase happens last
  - plugins.upload

  - bolt_expressions
  - bolt_expressions.contrib.commands
  - bolt.contrib.defer
  - bolt
  - bolt_native_macros
  - bolt_selectors
  - mecha.contrib.nesting
  - plugins.component_caching

  # needs to go last
  - plugins.custom_load

pipeline:
  - plugins.map_display
  - plugins.default_namespace_imports
  - plugins.component_import
  - mecha
  - plugins.namespace_mount
  # - plugins.minecraft_namespace_checker
  - plugins.cleanup_empty_functions
  # - data_pack:
  #     load: [vendor/*.zip]

data_pack:
  filter:
    block:
      - namespace: "minecraft"
        path: "recipes/*"
      - namespace: "minecraft"
        path: "advancements/*"
      - namespace: "minecraft"
        path: "loot_tables/*"

  load:
    data/shulker/structure/battlegrounds/arena.nbt: src/summit/arena.nbt

resource_pack:
  load:
    assets/shulker: src/summit/assets
    pack.png: src/summit/assets/pack.png

meta:
  deploy: false
  draw_bounding_box: true
  generate_namespace: "shulker"
  provided_namespaces: ["gu", "minecraft", "player_motion", "reef", "summit"]
  local_resource_namespaces: ["admin", "matching", "playerdb", "xp"]

  mecha:
    formatting:
      snbt_ensure_ascii: false

  bolt:
    entrypoint: "shulker:summit/*"
    prelude: ["shulker:server/prelude"]

  bolt_expressions:
    temp_objective: "temp"
    const_objective: "const"
    temp_storage: "bolt:temp"
    init_path: "core/load/init_objectives"
